ext.kotlin_version = '2.2.20'

allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // Force minimum compileSdk 34 for all plugin projects (not :app which sets its own)
                // This fixes android:attr/lStar and similar API 31+ resource attribute errors
                if (project.name != 'app') {
                    compileSdkVersion 34
                }
                if (namespace == null) {
                    def manifestFile = project.file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifest = new XmlParser().parse(manifestFile)
                        namespace = manifest.@package
                    } else {
                        namespace = "com.example.${project.name.replaceAll('-', '.')}"
                    }
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_1_8
                    targetCompatibility JavaVersion.VERSION_1_8
                }
                try {
                    kotlinOptions {
                        jvmTarget = "1.8"
                    }
                } catch (Exception e) {
                    // kotlinOptions not present
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
